<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vikasa Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="logomark" id="logomark">
    <img src="logomark.png" alt="Vikasa logomark">
  </div>

  <div class="phone hidden" id="phone">
 
    <div class="logomark-inner" id="nav-logo">
      <img src="nav.png" alt="Vikasa navlogo">
    </div>

    <div class="nav-screen hidden" id="nav-screen">
      <div class="top-bar">
        <div class="to-section">
          <span class="label">TO</span>
          <div class="coord-lines">
            <div class="coord-row">
              <span class="coord-label">RA:</span>
              <input class="blank" type="text" size="2">
              <span class="coord-unit">CU :</span>
              <input class="blank" type="text" size="2">
              <span class="coord-unit">LU</span>
            </div>
            <div class="coord-row">
              <span class="coord-label">DEC:</span>
              <input class="blank" type="text" size="2">
              <span class="coord-unit">° :</span>
              <input class="blank" type="text" size="2">
              <span class="coord-unit">LU</span>
            </div>
          </div>
        </div>
        <div class="from-section">
          <span class="label">FROM</span>
          <span class="here-btn">HERE</span>
        </div>
        <button class="done-btn" title="Done"><img src="arrow.png" alt="go"></button>
      </div>
      <div class="circle-map">
        <img src="circleg.png" alt="Navigation map">
        <svg class="circle-rings" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="transform: translateX(3%)">
          <circle cx="50" cy="49" r="43.2" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.4"/>
          <g class="spin-fast">
            <line x1="50" y1="49" x2="87.4" y2="27.4" stroke="rgba(255,255,255,0.35)" stroke-width="0.4"/>
          </g>
          <g class="spin-slow">
            <line x1="50" y1="49" x2="53.8" y2="92" stroke="rgba(255,255,255,0.35)" stroke-width="0.4"/>
          </g>
          <circle cx="50" cy="49" r="33" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
          <circle cx="50" cy="49" r="22" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.3"/>
          <circle cx="50" cy="49" r="11" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.3"/>
        </svg>
      </div>
      <div class="bottom-text">
        <p class="you-are">YOU ARE @</p>
        <p class="coords">RA = 6CU : 14LU</p>
        <p class="coords">DEC = -12° : 10LU</p>
      </div>
    </div>
  </div>

  <script>
    function checkBlanks() {
      const blanks = document.querySelectorAll('.to-section .blank');
      const allFilled = [...blanks].every(b => b.value.trim() !== '');
      document.querySelector('.done-btn').classList.toggle('glow', allFilled);
    }

    document.querySelectorAll('.to-section .blank').forEach(b => {
      b.addEventListener('input', checkBlanks);
    });

    document.getElementById('logomark').addEventListener('click', () => {
      document.getElementById('logomark').classList.add('hidden');
      document.getElementById('phone').classList.remove('hidden');

      setTimeout(() => {
        document.getElementById('nav-logo').classList.add('hidden');
        document.getElementById('nav-screen').classList.remove('hidden');
      }, 3500);
    });
  </script>
</body>
</html>
